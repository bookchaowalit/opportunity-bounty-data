# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (requires-python) and a current release, as in the sibling repos.
        python-version: ["3.10", "3.13"]
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: ${{ matrix.python-version }}
      # Offline pytest suite, then a CLI smoke over the packaged synthetic fixture (as in the README).
      # Installs from uv.lock (uv sync --frozen --all-extras); mypy and ruff come from the dev extra.
      # Ratchet: measured 82.68% on 2026-10-22 (ADR-0004: threshold = measured, rounded down); raise it as tests grow.
      coverage-threshold: "82"
      test-command: |
        python -m pytest -q --cov
        book-bounty-data contract > /dev/null
        book-bounty-data validate src/book_bounty_data/demo.json
        book-bounty-data demo --open-only > /dev/null

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
