[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-bounty-data"
version = "0.1.0"
description = "Find scoped paid tasks with clear acceptance and authorization."
requires-python = ">=3.10"
dependencies = ["jsonschema==4.19.2"]

[project.scripts]
book-bounty-data = "book_bounty_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_bounty_data = ["*.json"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7", "ruff==0.16.9", "mypy==2.4.0", "types-jsonschema"]
# Opt-in error reporting for capture runs (src/*/observability.py); off without SENTRY_DSN.
sentry = ["sentry-sdk>=2.72,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
# cli.py and tests/test_shared_cli.py are vendored (copied) across the sibling book-*-data repos; keep them
# byte-for-byte comparable with their siblings and reformat them only together.
exclude = ["src/*/cli.py", "tests/test_shared_cli.py"]

[tool.ruff.lint]
# Same correctness-focused set as the sibling book-*-data repos; the compact adapter style
# (E7 one-line statements) is intentionally left alone.
select = ["E9", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["src"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
# Gradual: the adapters predate type hints, so bodies are checked (check_untyped_defs)
# without requiring annotations everywhere. New modules are strict (override below);
# tighten the rest module by module.
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["book_bounty_data.observability"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
warn_return_any = true

# The shared capture runtime lives in data-lake-pipelines and is put on sys.path at run time.
[[tool.mypy.overrides]]
module = ["discovery.*"]
ignore_missing_imports = true
